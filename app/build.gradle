plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'kotlin-parcelize'
}

android {
    compileSdk 34

    namespace 'com.travelcompanion'

    defaultConfig {
        applicationId "com.travelcompanion"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // BuildConfig field for location provider selection
        buildConfigField "boolean", "USE_PLAY_SERVICES_LOCATION", "true"

        // Test instrumentation runner
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // For production, use your own keystore
            // storeFile file("release-key.jks")
            // storePassword "your-store-password"
            // keyAlias "your-key-alias"
            // keyPassword "your-key-password"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        viewBinding true
        dataBinding false
        buildConfig true
    }
}

dependencies {
    // --- Core ---
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    // AppCompat (necessario per Theme.AppCompat)
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.navigation:navigation-compose:2.7.6"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // --- DI ---
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-compiler:2.51.1"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"
    implementation "androidx.hilt:hilt-work:1.1.0"
    kapt "androidx.hilt:hilt-compiler:1.1.0"

    // --- DB ---
    def roomVersion = '2.7.0'
    implementation "androidx.room:room-runtime:${roomVersion}"
    implementation "androidx.room:room-ktx:${roomVersion}"
    kapt "androidx.room:room-compiler:${roomVersion}"
    implementation "androidx.room:room-paging:${roomVersion}"

    // --- Gson (for JSON serialization) ---
    implementation "com.google.code.gson:gson:2.10.1"

    // --- DataStore Preferences ---
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // --- Compose Runtime for LiveData ---
    implementation "androidx.compose.runtime:runtime-livedata"

    // --- Location & Maps ---
    implementation "com.google.android.gms:play-services-location:21.1.0"
    implementation "org.osmdroid:osmdroid-android:6.1.18"

    // Material Components (needed for styles referenced in resources)
    implementation "com.google.android.material:material:1.11.0"

    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // --- Background & Work ---
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // --- Charts ---
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"

    // --- Image Loading ---
    implementation "com.github.bumptech.glide:glide:4.16.0"
    kapt "com.github.bumptech.glide:compiler:4.16.0"

    // --- CameraX ---
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // --- Logging ---
    implementation "com.jakewharton.timber:timber:5.0.1"
}
