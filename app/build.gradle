plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp' version '1.9.22-1.0.17'
    id 'kotlin-parcelize'
}

android {
    compileSdk 34

    namespace 'com.travelcompanion'

    defaultConfig {
        applicationId "com.travelcompanion"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Flag per scegliere tra Play Services e fallback di sistema per la posizione
        buildConfigField "boolean", "USE_PLAY_SERVICES_LOCATION", "true"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    // Firma della build di release: legge i valori da local.properties (non versionato).
    // Per configurarla basta aggiungere queste righe a local.properties:
    //   RELEASE_STORE_FILE=percorso/del/keystore.jks
    //   RELEASE_STORE_PASSWORD=password_dello_store
    //   RELEASE_KEY_ALIAS=alias_della_chiave
    //   RELEASE_KEY_PASSWORD=password_della_chiave
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }
            storeFile props['RELEASE_STORE_FILE'] ? file(props['RELEASE_STORE_FILE']) : null
            storePassword props['RELEASE_STORE_PASSWORD'] ?: ''
            keyAlias props['RELEASE_KEY_ALIAS'] ?: ''
            keyPassword props['RELEASE_KEY_PASSWORD'] ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Abilita desugaring per supporto API moderne su Android più vecchi
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=kotlin.RequiresOptIn',
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=kotlinx.coroutines.FlowPreview'
        ]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Dove Room esporta gli schema del database
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    // Rende gli schema esportati da Room disponibili ai test di migrazione strumentati
    sourceSets {
        androidTest {
            assets.srcDirs += files("$projectDir/schemas")
        }
    }
}

dependencies {
    // --- Core AndroidX ---
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // --- Lifecycle ---
    def lifecycleVersion = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion"

    // --- Navigation ---
    def navVersion = "2.7.7"
    implementation "androidx.navigation:navigation-fragment-ktx:$navVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$navVersion"

    // --- Dependency Injection (Hilt) ---
    def hiltVersion = "2.50"
    implementation "com.google.dagger:hilt-android:$hiltVersion"
    ksp "com.google.dagger:hilt-compiler:$hiltVersion"
    implementation "androidx.hilt:hilt-work:1.1.0"
    ksp "androidx.hilt:hilt-compiler:1.1.0"

    // --- Room Database ---
    def roomVersion = '2.6.1'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.room:room-paging:$roomVersion"

    // --- JSON (Moshi — used by Room Converters for coordinate serialization) ---
    implementation "com.squareup.moshi:moshi:1.15.0"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.0"
    ksp "com.squareup.moshi:moshi-kotlin-codegen:1.15.0"

    // --- DataStore (Key-Value Storage) ---
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // --- Coroutines ---
    def coroutinesVersion = "1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$coroutinesVersion"

    // --- Location & Maps ---
    implementation "com.google.android.gms:play-services-location:21.1.0"
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.maps.android:android-maps-utils:3.8.2"  // Per heatmap

    // --- Background Work ---
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // --- Charts (MPAndroidChart) ---
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"

    // --- Image Loading ---
    implementation "com.github.bumptech.glide:glide:4.16.0"
    ksp "com.github.bumptech.glide:ksp:4.16.0"

    // --- OSMDroid (OpenStreetMap) ---
    implementation "org.osmdroid:osmdroid-android:6.1.18"

    // --- CameraX ---
    def cameraxVersion = "1.3.1"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // --- Logging (Timber) ---
    implementation "com.jakewharton.timber:timber:5.0.1"

    // --- UI Polish ---
    implementation "com.facebook.shimmer:shimmer:0.5.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // --- Java 8+ API desugaring ---
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // --- Testing ---
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
    testImplementation "app.cash.turbine:turbine:1.0.0"
    testImplementation "com.google.truth:truth:1.4.0"
    testImplementation "io.mockk:mockk:1.13.9"

    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
}
