# Project-wide Gradle settings.
# Ridotte le impostazioni di memoria per evitare OutOfMemory su macchine con <8GB
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Quando true Gradle esegue in parallelo. Limitiamo i worker per ridurre pressione di memoria.
org.gradle.parallel=true

# Limit parallel workers to reduce memory pressure
org.gradle.workers.max=1

# AndroidX and Kotlin settings
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kapt settings for better performance
kapt.incremental.apt=true
kapt.use.worker.api=true

# Kotlin daemon settings
kotlin.daemon.jvmargs=-Xmx1024m
